[build-system]
requires = ["hatchling", "hatch-regex-commit"]
build-backend = "hatchling.build"

[project]
name = "tep_class4"
dynamic = ["version"]
description = "Package to create class4 files"
requires-python = ">=3.11,<3.13"
readme = "README.md"
authors = [
    { name = "Charly Regnier", email = "cregnier@mercator-ocean.fr" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python",
]

dependencies = [
  "pip",
  "xarray",
  "geopy",
  "cartopy",
  "matplotlib",
  "scipy",
  "colorlog",
  "pykdtree",
  "pandas",
  "numpy",
  "netCDF4",
  "seawater",
  "joblib",
  "pyyaml",
  "filelock"
]

[project.urls]
Homepage = "https://gitlab.mercator-ocean.fr/mercator/qualif/TEP_CLASS4_creation"
Repository = "https://gitlab.mercator-ocean.fr/mercator/qualif/TEP_CLASS4_creation"        

[project.scripts]
class4-run = "tep_class4.cli.class4:main"
class4-run-parall = "tep_class4.cli.class4_parallel_leadtime_recomb:main"
class4-zarr  = "tep_class4.cli.class4_zarr:main"
stats-class4 = "tep_class4.cli.class4_stats_all:main"

[tool.hatch.version]
source = "regex_commit"
path = "src/tep_class4/version.py"
check_dirty = false
commit = true
commit_message = "[ci skip] Version bump committed by Jenkins"
tag = true
tag_message = "Tagged for deployment by Jenkins"
tag_sign = false

[tool.hatch.build.targets.sdist]
include = ["src/tep_class4"]

[tool.hatch.build.targets.wheel]
include = ['src/tep_class4']

[tool.hatch.envs.default]
type="conda"
command="conda"
prefix=".venv"
environment-file = "conda-env-dev.yml"
python = "3.12"


[tool.hatch.envs.lint]
skip-install = true
prefix=".venv"
dependencies = [
  "flake8 == 7.0",
  "pyproject-flake8 == 7.0",
]

[tool.hatch.envs.lint.scripts]
check = "pflake8 --exit-zero --format=pylint --output-file reports/flake8.txt TEP_class4_creation"

[tool.flake8]
exclude = ".venv, .hatch, test, .git, __init__.py"
exclude-ignore = "F403, F401, F405, E305, E302, E203, E722, W503"
max-line-length = 120

[tool.hatch.envs.test]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "pytest-watcher",
  "pre-commit",
]

[tool.hatch.envs.test.scripts]
run-coverage = "pytest -v -s --log-cli-level=INFO --cov-config=pyproject.toml --cov=TEP_class4_creation --cov-append --cov-report=xml:reports/cobertura.xml --junit-xml=reports/junit.xml --cov=tests"
run = "run-coverage --no-cov"

# Include additional files (like config files)
[tool.hatch.build]
# Tell Hatch where your source code lives
sources = ["src"]
include = [
    "src/tep_class4/cli/*",  # Include the CLI folder
    "src/tep_class4/core/*",  # Include the core module
    # Add any other necessary directories or files
]

[tool.coverage.run]
source_pkgs = ["src", "test"]
branch = true
parallel = true
omit = [
  "test/*"
]

[tool.coverage.paths]
py4cylc = ["src"]
tests = ["test", "functional_test"]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "__version__",
  "if TYPE_CHECKING:",
]
omit = [
  "/test/*",
  "/functional_test/*",
  "/examples/*",
  "/NOTEBOOKS/*",
]
