[GLOBAL]
CONFIGURATION=000GLORYS4V2
CONF=PSY4
MODELTYPE=ORCA12
DAILY_PREF=1d
TYPE_RUN=free
TYPE_ARCHI=free
SCHEDULE=DAILY
COVERING=glo
TYPE_FILE=PGN
LEVELS=50
LONMIN=-180
LONMAX=180
LATMIN=-90
LATMAX=90
gridtemp=gridT
gridsal=gridS
zoom=0
write_geojson=0
qc_level=0
do_qc=0
do_sort=0
do_decomp=0
comp_mssh=0
nb_points_interp=4
ll_zip=False
verif=False
ll_json=False

CONTACT=qualif@mercator-ocean.fr
INSTITUTION=MERCATOR OCEAN
VERSION=1
