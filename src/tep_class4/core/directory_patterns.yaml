directory_patterns:
  hdct:
    7dAV: "{dirmodel}HINDCAST/"
    default:
      nitrate: "{dirmodel}"
      ph: "{dirmodel}"
      chl: "{dirmodel}"
      chloro: "{dirmodel}"
      RTR: "{dirmodel}"
      REA: "{dirmodel}HEBDO/{modele}/"
      config_d: "{dirmodel}HEBDO/{config}/{config_lower}/"
      PSY4: "{dirmodel}HEBDO/{modele}/{modele_lower}/"

  hdct_all:
    allege: "{dirmodel}/"
    default: "{dirmodel}/"

  allege_types:
    allege_new: "{dirmodel}/"
    allege_now: "{dirmodel}/"

  fcst:
    7dAV: "{dirmodel}FORECAST/"
    default:
      GLO12: "{dirmodel}DAILY/{config}/{config_lower}/"
      PSY4: "{dirmodel}DAILY/{modele}/{modele_lower}/"
      BIO4: "{dirmodel}"

  clim: "{dirclim}/"
  clim_curr: "{dirclim}/"
  smoc: "{dirmodel}DAILY/SMOC/nwct/"
  stokes: "{dirmodel}DAILY/SMOC/nwct/"
  tides: "{dirmodel}DAILY/SMOC/nwct/"
  smoc_fcst: "{dirmodel}DAILY/SMOC/"
  stokes_fcst: "{dirmodel}DAILY/SMOC/"
  bathy: "{bathy_file}"
  general: "{dirclim}/"


file_handling:
  pgn:
    clim:
      chloro:
        1d-m:
            glob_pattern: "{dirmodel}/1998{month}{day}*.nc"
        1dAV:
            glob_pattern: "{dirmodel}/1998{month}{day}*.nc"
        1h-m:
           glob_pattern: "{dirmodel}/1998{month}*.nc"
        1mAV:
           glob_pattern: "{dirmodel}/1998{month}*.nc"
      drifter_filtr:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
      drifter:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
      current:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"

    non_clim:
      type_run:
         REA:
            glob_pattern: "{dirmodel}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         free:
            glob_pattern: "{dirmodel}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         RTR:
            glob_pattern: "{dirmodel}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         default:
            glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         smoc:         
            glob_pattern: "{dirmodel}/{directory}/{SMOC}_{dateval}*.nc"
         tides:         
            glob_pattern: "{dirmodel}/{directory}/{SMOC}_{dateval}*.nc"
         stokes:         
            glob_pattern: "{dirmodel}/{directory}/{SMOC}_{dateval}*.nc"
    default:
        glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*_*{gridtype}.nc"

  pgncg:
    clim:
      chloro:
        1d-m:
            glob_pattern: "{dirmodel}/1998{month}{day}*.nc"
        1dAV:
            glob_pattern: "{dirmodel}/1998{month}{day}*.nc"
        1h-m:
           glob_pattern: "{dirmodel}/1998{month}*.nc"
        1mAV:
           glob_pattern: "{dirmodel}/1998{month}*.nc"
      drifter_filtr:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
      drifter:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
      current:
        1d-m:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"
        1dAV:
           glob_pattern: "{dirmodel}/*_monthlymeans.nc"

    non_clim:
      type_run:
         REA:
            glob_pattern: "{dirmodel}/coarsed_grid/ALLEGES_CONCAT/RUN/{modele}*{daily_pref}{dateval}*{gridtype}*"
         free:
            glob_pattern: "{dirmodel}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         RTR:
            glob_pattern: "{dirmodel}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
         default:
            glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*_*{gridtype}*.nc"
    default:
        glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*_*{gridtype}.nc"


  pgs:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         RTR:
            glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*{gridtype}*nc"
         OPER:
            glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*{gridtype}*nc"
         OPER-FCST:
            glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*nc"

  pgs_ai:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         RTR:
             glob_pattern: "{dirmodel}/{directory}/{modele}_{dateval}_{gridtype}*nc"
         OPER:
             glob_pattern: "{dirmodel}/{directory}/{modele}_{dateval}_{gridtype}*nc"
    default:
      glob_pattern: "{dirmodel}/{directory}/{modele}_{dateval}_{gridtype}*nc"

  smoc:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
    default:
      glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
  
  clim_curr:
    clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/*_monthlymeans.nc"
 
  smoc_fcst:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/{directory}/SMOC_{dateval}*nc"
    default:
      glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
  
  stokes:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
    default:
      glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
  
  stokes_fcst:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/{directory}/SMOC_{dateval}*nc"
    default:
      glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
  
  
  tides:
    clim:
      glob_pattern: "{dirmodel}/*M{month}*nc"
    non_clim:
      type_run:
         OPER:
             glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"
    default:
      glob_pattern: "{dirmodel}/SMOC_{dateval}*nc"

  allege:
    clim:
      glob_pattern: "{dirmodel}/{type_clim}_M{month}_*{gridtype_clim}.nc"
    non_clim:
      glob_pattern: "{dirmodel}/{directory}/{modele}_{daily_pref}_{dateval}*{gridtype}*nc"

  2ease:
    default:
      - condition: "type_run == 'kaku'"
        actions:
          - glob_pattern: "{dirmodel}*{dateval[:6]}*.nc"
      - condition: "True"  # Default case
        actions:
          - error: "type not known for 2ease files"


